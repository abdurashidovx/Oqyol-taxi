name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = OQYOL TAXI/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = oqyoltaxi/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.oqyol/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.2.1,kivymd==1.1.1/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.ndk_path =/android.ndk = 25b/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: oqyol-taxi-apk
        path: bin/*.apk
